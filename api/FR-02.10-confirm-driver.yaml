openapi: 3.0.3
info:
  title: CAB System - FR-02.10 Confirm Driver API
  version: 1.0.0
  description: Khi tài xế chấp nhận chuyến, hệ thống ghi nhận tài xế và cập nhật chuyến sang DRIVER_ASSIGNED.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /dispatch-requests/{requestId}/accept:
    post:
      summary: Xác nhận tài xế nhận chuyến
      operationId: acceptTripRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          example: DREQ001
      responses:
        '200':
          description: Tài xế được xác nhận và chuyến được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
              example:
                requestId: DREQ001
                driverId: DRV001
                tripId: TRIP001
                tripStatus: DRIVER_ASSIGNED
        '404':
          description: Không tìm thấy yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AcceptResult:
      type: object
      properties:
        requestId:
          type: string
        driverId:
          type: string
        tripId:
          type: string
        tripStatus:
          type: string
          enum: [DRIVER_ASSIGNED]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ
