openapi: 3.0.3
info:
  title: CAB System - FR-02.02 Driver Availability API
  version: 1.0.0
  description: Hệ thống chỉ gửi yêu cầu chuyến đến tài xế có trạng thái AVAILABLE.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /drivers/available:
    get:
      summary: Kiểm tra trạng thái tài xế
      operationId: getAvailableDrivers
      responses:
        '200':
          description: Danh sách tài xế AVAILABLE
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableDriver'
              example:
                - driverId: DRV001
                  driverName: Nguyễn Văn A
                  status: AVAILABLE
        '404':
          description: Không có tài xế AVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AvailableDriver:
      type: object
      required: [driverId, status]
      properties:
        driverId:
          type: string
          example: DRV001
        driverName:
          type: string
          example: Nguyễn Văn A
        status:
          type: string
          enum: [AVAILABLE]
          example: AVAILABLE

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ
